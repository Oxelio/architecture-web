name: Delivery Coordinator Dry Run

# Observe the Ready Queue using read-only access. Execution requires a separate handoff.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - ready_for_review
    paths:
      - ".github/delivery-automation.json"
      - ".github/workflows/delivery-coordinator-dry-run.yml"
      - "packages/tooling/delivery-automation/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: delivery-coordinator-dry-run
  cancel-in-progress: false

jobs:
  observe:
    name: Observe deterministic delivery state
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Observe coordinator decision
        shell: bash
        env:
          ARCHITECTURE_WEB_PROJECTS_TOKEN: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') && secrets.ARCHITECTURE_WEB_PROJECTS_TOKEN || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          (
            cd packages/tooling/delivery-automation
            pnpm exec tsx src/cli/coordinator-dry-run.ts
          ) | tee coordinator-result.json
          status=${PIPESTATUS[0]}
          set -e

          if [[ "${status}" -eq 2 ]]; then
            echo "### Coordinator observation: blocked (fail-closed)" >> "${GITHUB_STEP_SUMMARY}"
            echo '```json' >> "${GITHUB_STEP_SUMMARY}"
            cat coordinator-result.json >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${status}" -ne 0 ]]; then
            exit "${status}"
          fi

          echo "### Coordinator observation" >> "${GITHUB_STEP_SUMMARY}"
          echo '```json' >> "${GITHUB_STEP_SUMMARY}"
          cat coordinator-result.json >> "${GITHUB_STEP_SUMMARY}"
          echo '```' >> "${GITHUB_STEP_SUMMARY}"
