name: Automatic coordinated release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_level:
        description: Automatic version, or explicit first stable release decision.
        type: choice
        options: [auto, first-stable]
        default: auto
      expected_sha:
        description: Exact main SHA authorized for first-stable (required in that mode).
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: architecture-web-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      source_sha: ${{ steps.plan.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve immutable source and version
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_LEVEL: ${{ inputs.release_level || 'auto' }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: pnpm --filter @architecture/delivery-automation release:ci-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.plan.outputs.version != ''
        with:
          name: release-plan
          path: release-plan.json
          if-no-files-found: error
          retention-days: 14

  validate:
    needs: plan
    if: needs.plan.outputs.version != ''
    uses: ./.github/workflows/repository-validation.yml
    with:
      candidate_sha: ${{ needs.plan.outputs.source_sha }}
      comparison_base: ""

  generate:
    needs: [plan, validate]
    if: needs.plan.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-plan
      - name: Generate versioned source archive without modifying the checkout
        run: pnpm --filter @architecture/delivery-automation release:generate "${RUNNER_TEMP}/release" "${GITHUB_WORKSPACE}/release-plan.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, validate, generate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout trusted control revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release
      - name: Verify immutable metadata and publish tag and release only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm --filter @architecture/delivery-automation release:publish "${RUNNER_TEMP}/release"
