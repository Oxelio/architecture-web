name: Delivery Project Status

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      work_number:
        required: true
        type: number
      command_comment_id:
        required: true
        type: number
      recovery_comment_id:
        required: true
        type: number

permissions:
  contents: read
  issues: read

env:
  TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
  DELIVERY_PROJECT_STATUS_COMMANDS_ENABLED: ${{ vars.DELIVERY_PROJECT_STATUS_COMMANDS_ENABLED }}
  DELIVERY_PROJECT_STATUS_CHANNEL_COMMENT_ID: ${{ vars.DELIVERY_PROJECT_STATUS_CHANNEL_COMMENT_ID }}
  DELIVERY_STANDING_EXECUTION_ENABLED: ${{ vars.DELIVERY_STANDING_EXECUTION_ENABLED }}
  DELIVERY_STANDING_DELEGATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_DELEGATION_COMMENT_ID }}
  STATUS_COMMAND_WORK_NUMBER: ${{ github.event.issue.number || inputs.work_number }}
  STATUS_COMMAND_COMMENT_ID: ${{ github.event.comment.id || inputs.command_comment_id }}
  STATUS_RECOVERY_COMMENT_ID: ${{ inputs.recovery_comment_id }}

jobs:
  authenticate:
    if: >-
      github.repository_id == '1336937640' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      vars.DELIVERY_PROJECT_STATUS_COMMANDS_ENABLED == 'true' &&
      vars.DELIVERY_PROJECT_STATUS_CHANNEL_COMMENT_ID != '' &&
      ((vars.DELIVERY_STANDING_EXECUTION_ENABLED == 'true' &&
        vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID != '') ||
       (vars.DELIVERY_STANDING_EXECUTION_ENABLED != 'true' &&
        vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID != '')) &&
      ((github.event_name == 'issue_comment' &&
        !github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '{') &&
        contains(github.event.comment.body, '"record-work-status"')) ||
       (github.event_name == 'workflow_dispatch' && github.actor_id == '83680141'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.intake.outputs.eligible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify the command without a write credential
        id: intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STATUS_COMMAND_INTAKE_ONLY: "true"
        run: |
          set -euo pipefail
          pnpm --filter @architecture/delivery-automation exec tsx src/cli/project-status.ts > intake.json
          if jq -e '.status == "eligible"' intake.json >/dev/null; then
            printf 'eligible=true\n' >> "$GITHUB_OUTPUT"
          fi

  record:
    needs: authenticate
    if: needs.authenticate.outputs.eligible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: delivery-work-controller
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    concurrency:
      group: delivery-work-controller-protected
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: controller-token
        with:
          client-id: ${{ vars.DELIVERY_CONTROLLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DELIVERY_CONTROLLER_APP_PRIVATE_KEY }}
          owner: Oxelio
          repositories: architecture-web
          permission-contents: write
      - name: Record an authorized Status change or reconcile an earlier one
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_STANDING_BOUNDARY_COMMENT_ID: ${{ vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID }}
          DELIVERY_STANDING_VALIDATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID }}
          DELIVERY_OBSERVATION_PROJECTS_TOKEN: ${{ secrets.DELIVERY_OBSERVATION_PROJECTS_TOKEN }}
          DELIVERY_PROJECT_STATUS_WRITE_TOKEN: ${{ secrets.DELIVERY_PROJECT_STATUS_WRITE_TOKEN }}
          CONTROLLER_INSTALLATION_TOKEN: ${{ steps.controller-token.outputs.token }}
          CONTROLLER_APP_SLUG: ${{ steps.controller-token.outputs.app-slug }}
          CONTROLLER_INSTALLATION_ID: ${{ steps.controller-token.outputs.installation-id }}
          EXPECTED_CONTROLLER_INSTALLATION_ID: ${{ vars.DELIVERY_CONTROLLER_INSTALLATION_ID }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/project-status.ts
