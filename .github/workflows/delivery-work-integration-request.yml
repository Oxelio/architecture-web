name: Delivery Work Integration Request

on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Repository CI]
    types: [completed]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  authenticate:
    if: >-
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor_id == '83680141' &&
      github.event.sender.id == 83680141 &&
      vars.DELIVERY_DIRECT_GRANT_COMMENT_ID != '' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/architecture-web direct-squash')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Authenticate the request without granting merge capability
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_DIRECT_GRANT_COMMENT_ID: ${{ vars.DELIVERY_DIRECT_GRANT_COMMENT_ID }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-integration-request.ts

  standing-candidate:
    if: >-
      github.event_name == 'workflow_run' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event.workflow_run.conclusion == 'success' &&
      vars.DELIVERY_STANDING_REQUESTS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: delivery-integration-observation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Observe candidate facts on protected main
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_STANDING_REQUESTS_ENABLED: ${{ vars.DELIVERY_STANDING_REQUESTS_ENABLED }}
          DELIVERY_STANDING_CONTROLLER_BOT_ID: ${{ vars.DELIVERY_STANDING_CONTROLLER_BOT_ID }}
          DELIVERY_OBSERVATION_PROJECTS_TOKEN: ${{ secrets.DELIVERY_OBSERVATION_PROJECTS_TOKEN }}
          DELIVERY_STANDING_DELEGATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_DELEGATION_COMMENT_ID }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-integration-request.ts

  standing-evidence-intake:
    if: >-
      github.repository_id == '1336937640' &&
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      startsWith(github.event.comment.body, '{') &&
      contains(github.event.comment.body, '"accepted"') &&
      ((vars.DELIVERY_STANDING_EXECUTION_ENABLED == 'true' &&
        vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID != '') ||
       (vars.DELIVERY_STANDING_EXECUTION_ENABLED != 'true' &&
        vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      eligible_signal: ${{ steps.intake.outputs.eligible_signal }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Authenticate the wakeup outside the privileged queue
        id: intake
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_STANDING_WAKEUP_ONLY: "true"
          DELIVERY_STANDING_EXECUTION_ENABLED: ${{ vars.DELIVERY_STANDING_EXECUTION_ENABLED }}
          DELIVERY_STANDING_BOUNDARY_COMMENT_ID: ${{ vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID }}
          DELIVERY_STANDING_VALIDATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID }}
        run: |
          set -euo pipefail
          pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-integration-request.ts > wakeup.json
          if jq -e '.status == "selected"' wakeup.json >/dev/null; then
            printf 'eligible_signal=true\n' >> "$GITHUB_OUTPUT"
          fi

  standing-controller:
    needs: standing-evidence-intake
    if: >-
      !cancelled() &&
      github.repository_id == '1336937640' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      ((github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.head_repository.id == 1336937640) ||
       (github.event_name == 'issue_comment' &&
        needs.standing-evidence-intake.outputs.eligible_signal == 'true')) &&
      ((vars.DELIVERY_STANDING_EXECUTION_ENABLED == 'true' &&
        vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID != '') ||
       (vars.DELIVERY_STANDING_EXECUTION_ENABLED != 'true' &&
        vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: delivery-work-controller
    permissions:
      contents: read
      issues: read
      pull-requests: read
      checks: read
    concurrency:
      group: delivery-work-controller-protected
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: controller-token
        with:
          client-id: ${{ vars.DELIVERY_CONTROLLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DELIVERY_CONTROLLER_APP_PRIVATE_KEY }}
          owner: Oxelio
          repositories: architecture-web
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: gate-token
        with:
          client-id: ${{ vars.DELIVERY_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DELIVERY_GATE_APP_PRIVATE_KEY }}
          owner: Oxelio
          repositories: architecture-web
          permission-checks: write
      - name: Evaluate and integrate an eligible candidate through the protected controller
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_STANDING_EXECUTION_ENABLED: ${{ vars.DELIVERY_STANDING_EXECUTION_ENABLED }}
          DELIVERY_STANDING_VALIDATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_VALIDATION_COMMENT_ID }}
          DELIVERY_STANDING_BOUNDARY_COMMENT_ID: ${{ vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID }}
          DELIVERY_STANDING_DELEGATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_DELEGATION_COMMENT_ID }}
          DELIVERY_OBSERVATION_PROJECTS_TOKEN: ${{ secrets.DELIVERY_OBSERVATION_PROJECTS_TOKEN }}
          CONTROLLER_INSTALLATION_TOKEN: ${{ steps.controller-token.outputs.token }}
          CONTROLLER_APP_SLUG: ${{ steps.controller-token.outputs.app-slug }}
          CONTROLLER_INSTALLATION_ID: ${{ steps.controller-token.outputs.installation-id }}
          EXPECTED_CONTROLLER_INSTALLATION_ID: ${{ vars.DELIVERY_CONTROLLER_INSTALLATION_ID }}
          GATE_APP_TOKEN: ${{ steps.gate-token.outputs.token }}
          GATE_INSTALLATION_ID: ${{ steps.gate-token.outputs.installation-id }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-integration-request.ts
