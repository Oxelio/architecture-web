name: Reusable repository validation

on:
  workflow_call:
    inputs:
      candidate_sha:
        description: Exact source commit to validate.
        required: true
        type: string
      comparison_base:
        description: Exact diff base; empty selects the candidate's first parent.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository and delivery tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Verify immutable validation identity
        id: identity
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          COMPARISON_BASE: ${{ inputs.comparison_base }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          if [[ -z "${COMPARISON_BASE}" || "${COMPARISON_BASE}" == 0000000000000000000000000000000000000000 ]]; then
            COMPARISON_BASE="$(git rev-parse --verify HEAD^ 2>/dev/null || git hash-object -w -t tree /dev/null)"
          fi
          [[ "${COMPARISON_BASE}" =~ ^[a-f0-9]{40}$ ]]
          git cat-file -e "${COMPARISON_BASE}"
          echo "base=${COMPARISON_BASE}" >> "${GITHUB_OUTPUT}"
          {
            echo '## Validation identity'
            echo "Candidate: ${CANDIDATE_SHA}; comparison base: ${COMPARISON_BASE}"
            echo "Trigger SHA: ${GITHUB_SHA}; ref: ${GITHUB_REF}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Preview release version without publishing
        run: pnpm release:plan

      - name: Typecheck
        run: pnpm typecheck

      - name: Typecheck tests
        run: pnpm typecheck:test

      - name: Lint
        run: pnpm lint

      - name: Test with coverage and real IAM integration
        run: pnpm ci:test:integration

      - name: Prepare repository-relative LCOV
        run: node scripts/merge-coverage.mjs

      - name: Test coverage path handling
        run: pnpm ci:test:tooling

      - name: Export coverage from this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sonar-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1

      - name: Verify artifact download even when Sonar is skipped
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/coverage-roundtrip

      - name: Verify coverage artifact contents
        run: cmp coverage/lcov.info "${RUNNER_TEMP}/coverage-roundtrip/lcov.info"

      - name: Check formatting
        run: pnpm format:check

      - name: Check documentation links
        run: pnpm docs:links

      - name: Test documentation link validation
        run: pnpm docs:links:test

      - name: Check whitespace errors
        env:
          COMPARISON_BASE: ${{ steps.identity.outputs.base }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: git diff --check "${COMPARISON_BASE}" "${CANDIDATE_SHA}"

  node-compatibility:
    name: Node 24 compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.15.0"
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm typecheck:test
      - run: pnpm test
