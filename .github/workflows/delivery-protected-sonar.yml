name: Protected Sonar analysis

on:
  workflow_dispatch:
    inputs:
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string

permissions: {}

jobs:
  coverage:
    if: >-
      vars.DELIVERY_PROTECTED_SONAR_ENABLED == 'true' &&
      github.repository_id == '1336937640' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      inputs.base_sha == github.workflow_sha
    permissions:
      contents: read
    uses: ./.github/workflows/repository-validation.yml
    with:
      candidate_sha: ${{ inputs.head_sha }}
      comparison_base: ${{ inputs.base_sha }}

  producer:
    name: Protected Sonar producer
    needs: coverage
    runs-on: ubuntu-24.04
    environment: delivery-protected-sonar-producer
    timeout-minutes: 20
    concurrency:
      group: delivery-work-controller-protected
      queue: max
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify exact SHA inputs
        env:
          SONAR_HEAD_SHA: ${{ inputs.head_sha }}
          SONAR_BASE_SHA: ${{ inputs.base_sha }}
        run: |
          [[ "${SONAR_HEAD_SHA}" =~ ^[a-f0-9]{40}$ ]]
          [[ "${SONAR_BASE_SHA}" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_sha }}
          path: sonar-candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-coverage
          path: ${{ runner.temp }}/sonar-coverage
      - name: Prepare data-only checkout and pinned scanner
        env:
          SONAR_HEAD_SHA: ${{ inputs.head_sha }}
          SONAR_BASE_SHA: ${{ inputs.base_sha }}
          SCANNER_VERSION: ${{ vars.DELIVERY_SONAR_SCANNER_VERSION }}
          SCANNER_DIGEST: ${{ vars.DELIVERY_SONAR_SCANNER_DIGEST }}
        run: |
          set -euo pipefail
          test "$(git -C sonar-candidate rev-parse HEAD)" = "${SONAR_HEAD_SHA}"
          git -C sonar-candidate cat-file -e "${SONAR_BASE_SHA}^{commit}"
          git -C sonar-candidate ls-tree -r HEAD > "${RUNNER_TEMP}/sonar-tree"
          if grep -Eq '^(120000|160000) ' "${RUNNER_TEMP}/sonar-tree"; then
            # The repository's documentation submodule is not checked out.
            awk '$1 == "120000" || ($1 == "160000" && $4 != "external/software-engineering-method") { invalid = 1 } END { exit invalid }' "${RUNNER_TEMP}/sonar-tree"
          fi
          test ! -e sonar-candidate/coverage
          mkdir sonar-candidate/coverage
          test -f "${RUNNER_TEMP}/sonar-coverage/lcov.info"
          test ! -L "${RUNNER_TEMP}/sonar-coverage/lcov.info"
          cp "${RUNNER_TEMP}/sonar-coverage/lcov.info" sonar-candidate/coverage/lcov.info
          [[ "${SCANNER_VERSION}" =~ ^[0-9]+(\.[0-9]+){3}$ ]]
          [[ "${SCANNER_DIGEST}" =~ ^[a-f0-9]{64}$ ]]
          scanner="sonar-scanner-cli-${SCANNER_VERSION}-linux-x64.zip"
          curl --fail --silent --show-error --connect-timeout 10 --max-time 120 \
            "https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/${scanner}" \
            --output "${RUNNER_TEMP}/protected-scanner.zip"
          printf '%s  %s\n' "${SCANNER_DIGEST}" "${RUNNER_TEMP}/protected-scanner.zip" | sha256sum --check
          unzip -q "${RUNNER_TEMP}/protected-scanner.zip" -d "${RUNNER_TEMP}/protected-scanner"
          executable="${RUNNER_TEMP}/protected-scanner/sonar-scanner-${SCANNER_VERSION}-linux-x64/bin/sonar-scanner"
          test -x "${executable}"
          printf 'SONAR_SCANNER_EXECUTABLE=%s\n' "${executable}" >> "${GITHUB_ENV}"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: controller
        with:
          client-id: ${{ vars.DELIVERY_CONTROLLER_APP_CLIENT_ID }}
          private-key: ${{ secrets.DELIVERY_CONTROLLER_APP_PRIVATE_KEY }}
          owner: Oxelio
          repositories: architecture-web
          permission-contents: write
      - name: Admit and submit an exact-candidate analysis
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          SONAR_CANDIDATE_DIRECTORY: ${{ github.workspace }}/sonar-candidate
          SONAR_HEAD_SHA: ${{ inputs.head_sha }}
          SONAR_BASE_SHA: ${{ inputs.base_sha }}
          SCANNER_DIGEST: ${{ vars.DELIVERY_SONAR_SCANNER_DIGEST }}
          DELIVERY_PROTECTED_SONAR_ENABLED: ${{ vars.DELIVERY_PROTECTED_SONAR_ENABLED }}
          DELIVERY_SONAR_PRODUCER_COMMENT_ID: ${{ vars.DELIVERY_SONAR_PRODUCER_COMMENT_ID }}
          DELIVERY_AUTHORING_MAXIMUM_HISTORY_REVISIONS: ${{ vars.DELIVERY_AUTHORING_MAXIMUM_HISTORY_REVISIONS }}
          DELIVERY_STANDING_BOUNDARY_COMMENT_ID: ${{ vars.DELIVERY_STANDING_BOUNDARY_COMMENT_ID }}
          DELIVERY_STANDING_DELEGATION_COMMENT_ID: ${{ vars.DELIVERY_STANDING_DELEGATION_COMMENT_ID }}
          DELIVERY_OBSERVATION_PROJECTS_TOKEN: ${{ secrets.DELIVERY_OBSERVATION_PROJECTS_TOKEN }}
          CONTROLLER_INSTALLATION_TOKEN: ${{ steps.controller.outputs.token }}
          CONTROLLER_INSTALLATION_ID: ${{ steps.controller.outputs.installation-id }}
          CONTROLLER_APP_SLUG: ${{ steps.controller.outputs.app-slug }}
          SONAR_ANALYSIS_TOKEN: ${{ secrets.DELIVERY_SONAR_ANALYSIS_TOKEN }}
          SONAR_BROWSE_TOKEN: ${{ secrets.DELIVERY_SONAR_BROWSE_TOKEN }}
        run: pnpm --dir packages/tooling/delivery-automation exec tsx src/cli/protected-sonar-producer.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: protected-sonar-submission
          path: ${{ runner.temp }}/submission.json
          if-no-files-found: error
          retention-days: 1
