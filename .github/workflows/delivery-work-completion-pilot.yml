name: Delivery Work Completion

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Merged Work Integration PR to recover
        required: true
        type: string

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  complete:
    if: >-
      vars.DELIVERY_COMPLETION_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      (
        (github.event_name == 'pull_request_target' &&
          github.event.pull_request.merged == true) ||
        (github.event_name == 'workflow_dispatch' &&
          github.actor_id == '83680141')
      )
    concurrency:
      group: delivery-work-completion-${{ github.event.pull_request.number || inputs.pull_number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: delivery-work-completion-pilot
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify and publish Work completion
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          COMPLETION_PULL_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          COMPLETION_WAIT_FOR_DOWNSTREAM: ${{ github.event_name == 'pull_request_target' }}
          COMPLETION_PROJECTS_TOKEN: ${{ secrets.DELIVERY_COMPLETION_PROJECTS_TOKEN }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-completion-pilot.ts
