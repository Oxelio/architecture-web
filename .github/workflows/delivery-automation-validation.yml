name: Repository CI
run-name: >-
  ${{ github.event_name == 'pull_request' && format('Repository CI [{0}] PR #{1}',
      github.event.action == 'edited' && !github.event.changes.base &&
      (github.event.changes.title || github.event.changes.body) && 'metadata' || 'full',
      github.event.pull_request.number) || 'Repository CI [full]' }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Edited runs cannot displace a running OR pending full candidate validation.
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && github.run_id || 'candidate' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    name: Select validation route
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.route.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - id: route
        run: node scripts/quality-gate.mjs route

  validate:
    needs: route
    if: needs.route.outputs.mode == 'full'
    uses: ./.github/workflows/repository-validation.yml
    with:
      candidate_sha: ${{ github.sha }}
      comparison_base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

  dependency-review:
    name: Dependency review
    needs: route
    if: github.event_name == 'pull_request' && needs.route.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-patched-versions: true

  quality:
    name: Quality checks
    needs: [route, validate, dependency-review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    concurrency:
      group: repository-quality-${{ github.event.pull_request.number || github.ref }}-${{ needs.route.outputs.mode }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - if: github.event_name == 'pull_request'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - if: github.event_name == 'pull_request'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate current PR title and require candidate-bound evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ROUTE_RESULT: ${{ needs.route.result }}
          VALIDATION_MODE: ${{ needs.route.outputs.mode }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: node scripts/quality-gate.mjs

  sonar:
    name: SonarQube Cloud analysis
    needs: [route, validate]
    # Never give a fork or Dependabot candidate access to the analysis credential.
    if: >-
      needs.route.outputs.mode == 'full' &&
      ((github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check Sonar configuration
        id: config
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          enabled=true
          for name in SONAR_HOST_URL SONAR_PROJECT_KEY SONAR_ORGANIZATION SONAR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::warning::Sonar skipped: configure ${name}; see docs/development/continuous-integration.md."
              enabled=false
            fi
          done
          if [ "${enabled}" = true ] && [[ "${SONAR_HOST_URL}" != https://* ]]; then
            echo '::warning::Sonar skipped: SONAR_HOST_URL must use HTTPS.'
            enabled=false
          fi
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Checkout analyzed commit with history
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Import the validated type context from this workflow run
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-type-context
          path: ${{ runner.temp }}/sonar-type-context

      - name: Restore analysis dependencies without executing candidate code
        if: steps.config.outputs.enabled == 'true'
        run: tar --extract --gzip --file="${RUNNER_TEMP}/sonar-type-context/sonar-type-context.tar.gz" --no-same-owner --no-same-permissions

      - name: Verify workspace declaration layout
        if: steps.config.outputs.enabled == 'true'
        run: |
          test -f packages/contexts/iam/dist/application/index.d.ts
          test -f packages/contexts/iam/dist/domain/index.d.ts
          test -f packages/adapters/iam/persistence-kysely/node_modules/kysely/package.json

      - name: Import coverage from this workflow run
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-coverage
          path: coverage

      - name: Analyze and wait for the informational Quality Gate
        id: scan
        if: steps.config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Report informational analysis outcome
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.enabled }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo '## SonarQube Cloud analysis'
            echo "Candidate: ${GITHUB_SHA}"
            echo "Configured: ${CONFIGURED:-false}; scan/Quality Gate: ${SCAN_OUTCOME:-skipped}"
            echo 'Sonar findings, failed Quality Gates and analysis errors do not block repository validation or source publication.'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${CONFIGURED}" = true ] && [ "${SCAN_OUTCOME}" != success ]; then
            echo '::warning::Sonar analysis or its Quality Gate did not succeed. Review this job and the Sonar dashboard.'
          fi
