name: Repository CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    uses: ./.github/workflows/repository-validation.yml
    with:
      candidate_sha: ${{ github.sha }}
      comparison_base: ${{ github.event.pull_request.base.sha || github.event.before || '' }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          vulnerability-check: true
          license-check: false
          show-patched-versions: true

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate the prospective squash commit header
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "${PR_TITLE}" | pnpm exec commitlint

  quality:
    name: Quality checks
    needs: [validate, dependency-review, commitlint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require every applicable blocking check
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
          COMMITLINT_RESULT: ${{ needs.commitlint.result }}
        run: node scripts/quality-gate.mjs

  sonar:
    name: SonarQube (informational)
    needs: validate
    # Never give a fork or Dependabot candidate access to the analysis credential.
    if: >-
      (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Check Sonar configuration
        id: config
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          enabled=true
          for name in SONAR_HOST_URL SONAR_PROJECT_KEY SONAR_ORGANIZATION SONAR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::warning::Sonar skipped: configure ${name}; see docs/development/continuous-integration.md."
              enabled=false
            fi
          done
          if [ "${enabled}" = true ] && [[ "${SONAR_HOST_URL}" != https://* ]]; then
            echo '::warning::Sonar skipped: SONAR_HOST_URL must use HTTPS.'
            enabled=false
          fi
          echo "enabled=${enabled}" >> "${GITHUB_OUTPUT}"

      - name: Checkout analyzed commit with history
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for analysis dependencies
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm without installing
        if: steps.config.outputs.enabled == 'true'
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false

      - name: Install locked type dependencies without candidate hooks
        if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile

      - name: Import workspace declarations from this workflow run
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-workspace-types
          path: packages

      - name: Verify workspace declaration layout
        if: steps.config.outputs.enabled == 'true'
        run: |
          test -f packages/contexts/iam/dist/application/index.d.ts
          test -f packages/contexts/iam/dist/domain/index.d.ts

      - name: Import coverage from this workflow run
        if: steps.config.outputs.enabled == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sonar-coverage
          path: coverage

      - name: Analyze and wait for the informational Quality Gate
        id: scan
        if: steps.config.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >-
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

      - name: Report informational analysis outcome
        if: always()
        env:
          CONFIGURED: ${{ steps.config.outputs.enabled }}
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          {
            echo '## SonarQube — informational'
            echo "Candidate: ${GITHUB_SHA}"
            echo "Configured: ${CONFIGURED:-false}; scan/Quality Gate: ${SCAN_OUTCOME:-skipped}"
            echo 'Sonar findings, failed Quality Gates and analysis errors do not block repository validation or source publication.'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${CONFIGURED}" = true ] && [ "${SCAN_OUTCOME}" != success ]; then
            echo '::warning::Sonar analysis or its Quality Gate did not succeed. Review this job and the Sonar dashboard.'
          fi
