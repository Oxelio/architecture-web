name: Delivery Work Gate Issuer Probe

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact pilot PR head
        required: true
        type: string
      base_sha:
        description: Exact main base
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  publish-probe:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.actor_id == '83680141' &&
      vars.DELIVERY_GATE_ISSUER_PROBE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: delivery-work-gate-issuer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: gate-token
        with:
          client-id: ${{ vars.DELIVERY_GATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DELIVERY_GATE_APP_PRIVATE_KEY }}
          owner: Oxelio
          repositories: architecture-web
          permission-checks: write
      - name: Publish a non-required issuer probe
        env:
          TRUSTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          PILOT_GATE_APP_TOKEN: ${{ steps.gate-token.outputs.token }}
          PILOT_GATE_APP_ID: ${{ vars.DELIVERY_GATE_APP_ID }}
          PILOT_WORK_NUMBER: ${{ vars.DELIVERY_GATE_PILOT_WORK }}
          PILOT_PULL_NUMBER: ${{ vars.DELIVERY_GATE_PILOT_PR }}
          PILOT_HEAD_SHA: ${{ inputs.head_sha }}
          PILOT_BASE_SHA: ${{ inputs.base_sha }}
        run: pnpm --filter @architecture/delivery-automation exec tsx src/cli/work-gate-issuer-probe.ts
