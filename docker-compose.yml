services:
  postgres:
    image: postgres:17-alpine
    container_name: architecture-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: architecture
      POSTGRES_USER: architecture
      POSTGRES_PASSWORD: architecture
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architecture -d architecture"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
