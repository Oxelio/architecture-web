services:
  postgres:
    image: postgres:17-alpine
    container_name: architecture-web-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: architecture
      POSTGRES_USER: architecture
      POSTGRES_PASSWORD: architecture
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U architecture -d architecture"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: architecture-web-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: architecture-web-api:latest
    build:
      context: ./apps/api
    container_name: architecture-web-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: architecture
      DATABASE_USER: architecture
      DATABASE_PASSWORD: architecture
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WEB_ORIGIN: http://localhost:5173
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: user
      SMTP_PASSWORD: user
      SMTP_FROM_ADDRESS: no-reply@architecture.local
      SMTP_VERIFY_URL: http://localhost:3000/v1/identity
    ports:
      - "3000:3000"

  web:
    image: architecture-web-web:latest
    build:
      context: ./apps/web
    container_name: architecture-web-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
    ports:
      - "5173:8080"

  mailpit:
    image: axllent/mailpit:latest
    container_name: architecture-web-mailpit
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # UI web

volumes:
  postgres-data:
  redis-data:
