services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: iam_refactor_test
      POSTGRES_USER: iam_test
      POSTGRES_PASSWORD: iam_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_test -d iam_refactor_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
