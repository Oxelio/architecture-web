services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: iam_refactor_test
      POSTGRES_USER: iam_test
      POSTGRES_PASSWORD: iam_test
    tmpfs:
      - /var/lib/postgresql
    logging:
      driver: none
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam_test -d iam_refactor_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.8.1-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    logging:
      driver: none
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.5
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '@example\.test$$'
    tmpfs:
      - /tmp
    read_only: true
    logging:
      driver: none

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: builder
    working_dir: /app/apps/api
    command:
      - sh
      - -ec
      - test ! -e .env && node --import tsx src/scripts/migrate-up.ts && exec node dist/main.mjs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "false"
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: iam_refactor_test
      DATABASE_USER: iam_test
      DATABASE_PASSWORD: iam_test
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: fixture
      SMTP_PASSWORD: fixture
      SMTP_FROM_ADDRESS: fixture@example.test
      SMTP_VERIFY_URL: http://fixture.invalid/verify
      SMTP_RECOVERY_URL: http://fixture.invalid/recovery
      SMTP_DELETION_CANCELLATION_URL: http://fixture.invalid/cancel-deletion
      SECURITY_ENCRYPTION_KEY: disposable-fixture-key-do-not-reuse
    tmpfs:
      - /tmp
    read_only: true
    logging:
      driver: none

networks:
  default:
    internal: true
