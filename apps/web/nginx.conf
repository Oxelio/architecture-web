worker_processes auto;

pid /tmp/nginx.pid;

error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Native HTTP errors can contain raw request lines and cannot be sanitized.
    error_log /dev/null error;

    map $uri $request_group {
        default web;
        ~^/api/ api;
    }
    map $request_method $safe_method {
        default OTHER;
        GET GET;
        HEAD HEAD;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        OPTIONS OPTIONS;
    }
    log_format safe_access escape=json
        '{"time":"$time_iso8601","request_id":"$request_id",'
        '"group":"$request_group","method":"$safe_method",'
        '"status":"$status","duration":"$request_time",'
        '"upstream_status":"$upstream_status",'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_response_time":"$upstream_response_time"}';

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout safe_access;

    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://api:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}